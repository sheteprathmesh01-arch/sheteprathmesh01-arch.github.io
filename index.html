<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <div class="score">
        <span>You: <b id="you">0</b></span>
        <span>Computer: <b id="cpu">0</b></span>
    </div>

    <!-- each button sends its choice to play() -->
    <div class="choices">
        <button onclick="play('rock')">✊</button>
        <button onclick="play('paper')">✋</button>
        <button onclick="play('scissors')">✌️</button>
    </div>

    <p id="status">Pick one to start!</p>
    <p id="detail"></p>

    <button onclick="resetScore()">Reset Score</button>
    <a class="back" href="../index.html">Back to portfolio</a>

    <script src="script.js"></script>
</body>
</html>
